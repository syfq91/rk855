name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rk855
            archive_name: rk855-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rk855.exe
            archive_name: rk855-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libgl1-mesa-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin rk855 --bin rk855-gui

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/udev
          cp target/${{ matrix.target }}/release/rk855 package/
          cp target/${{ matrix.target }}/release/rk855-gui package/
          cp udev/99-rk855.rules package/udev/
          cp README.md package/
          cp LICENSE package/
          cd package
          tar -czvf ../${{ matrix.archive_name }} *

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/${{ matrix.target }}/release/rk855.exe package/
          Copy-Item target/${{ matrix.target }}/release/rk855-gui.exe package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive_name }}

      - name: Compute SHA-256 Checksum
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.archive_name }} SHA256 | grep -E "^[a-f0-9]{64}$" | tr -d '\r' > ${{ matrix.archive_name }}.sha256
          else
            sha256sum ${{ matrix.archive_name }} | awk '{print $1}' > ${{ matrix.archive_name }}.sha256
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Unified Checksums
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -name "*.tar.gz" -exec cp {} release_assets/ \;
          find artifacts/ -type f -name "*.zip" -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
