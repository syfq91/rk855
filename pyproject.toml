[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rk68"
version = "1.0.0"
description = "Native Linux configuration driver and GUI for Royal Kludge RK68 mechanical keyboards (0c45:8018)"
readme = "README.md"
authors = [{ name = "Royal Kludge Linux Community" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["keyboard", "rgb", "royal-kludge", "rk68", "linux", "sonix", "hidapi"]
dependencies = [
    "hidapi>=0.14.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.4.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
rk68 = "rk68.cli:main"
rk68-cli = "rk68.cli:main"
rk68-gui = "rk68.gui.main:main"

[tool.setuptools.packages.find]
include = ["rk68*"]
