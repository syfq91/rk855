[project]
name = "rk855"
version = "1.0.0"
description = "Royal Kludge RK855 (RK68) RGB lighting configurator, key remapper, and ISP firmware flasher"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "syfq91", email = "syfq91@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["keyboard", "rgb", "flasher", "rk855", "rk68", "sonix", "hid"]
dependencies = [
    "hidapi>=0.14.0",
    "intelhex>=2.3.0",
    "pyqt6>=6.5.0",
]

[project.scripts]
rk855-gui = "rk855_gui.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rk855_gui"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


