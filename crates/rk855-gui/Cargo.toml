[package]
name = "rk855-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop GUI for Royal Kludge RK855 (RK68) mechanical keyboard"

[[bin]]
name = "rk855-gui"
path = "src/main.rs"

[dependencies]
rk855-proto = { workspace = true, features = ["serde"] }
rk855-hid.workspace = true
rk855-config.workspace = true
rk855-isp.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
